[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/providers",
    "crates/tools",
    "crates/loop",
    "crates/store",
    "crates/sim",
    "crates/workspace",
    "crates/daemon",
]

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
async-trait = "0.1"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["serde", "macros"] }
tokio = { version = "1", features = ["macros", "rt", "sync"] }
toml = "0.8"

harness-core = { path = "crates/core" }
harness-providers = { path = "crates/providers" }
harness-tools = { path = "crates/tools" }
harness-store = { path = "crates/store" }
harness-loop = { path = "crates/loop" }
harness-workspace = { path = "crates/workspace" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
