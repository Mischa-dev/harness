# The daemon's config. It names key files and never holds keys; under
# systemd, point key_file at $CREDENTIALS_DIRECTORY (LoadCredential=).

[proxy]
# Loopback only: the proxy adds a key to anything it is sent.
listen = "127.0.0.1:8787"
# Callers send this file's contents in x-harness-proxy-token. Give it to the
# runtime only, never to workers. Make one with `openssl rand -hex 32`.
caller_token_file = "/run/credentials/harness-daemon.service/caller-token"

# Adapters call http://127.0.0.1:8787/anthropic/v1/messages and so on.
[[proxy.route]]
name = "anthropic"
upstream = "https://api.anthropic.com"
auth = "x-api-key"
key_file = "/run/credentials/harness-daemon.service/anthropic"

[[proxy.route]]
name = "openrouter"
upstream = "https://openrouter.ai/api"
auth = "bearer"
key_file = "/run/credentials/harness-daemon.service/openrouter"

# The wake loop: `harness-daemon run --config <path>`. Run it as its own
# service, separate from the proxy, with only the caller token as a
# credential; it never sees a provider key.
[agent]
state_dir = "/var/lib/harness"
workdir = "/home/agent"
profiles_file = "/etc/harness/profiles.toml"
# A profile name from profiles_file; the model itself is set there.
profile = "main"
# The proxy route for that profile's provider. Must be on loopback.
model_url = "http://127.0.0.1:8787/anthropic"
caller_token_file = "/run/credentials/harness-agent.service/caller-token"
# prompts/teammate-charter.md, followed by the agent's SOUL. Its
# {{agent_name}}, {{owner_name}} and {{responsibilities}} come from
# [agent.identity] below.
charter_file = "/etc/harness/charter.md"
# The owner's local hour when the day ends, and their offset from UTC.
quiet_hour = 2
utc_offset_hours = 0
# The agent's own memory (MEMORY.md, USER.md, the handoff note, the journal),
# with its history in git under state_dir. Leave it out for `memory` inside
# workdir; it must be a real folder, not a symlink.
memory_dir = "/home/agent/memory"

# Who the agent is, for the charter. Responsibilities say what it owns, not
# what to do; give it two to five.
[agent.identity]
name = "Mara"
owner = "Mischa"
responsibilities = [
  "Keep the harness repo healthy: CI green, dependencies current, advisories handled",
  "Make the docs match the code",
]

# Workspace's signed wakeups (inbox.available). Set the webhook URL on the
# agent's Workspace connection to http://<listen>/wake; Workspace shows the
# signing secret once. Leave this table out and the agent wakes only at the
# looks it chooses.
[agent.wakeups]
listen = "100.64.0.5:8790"
agent_id = "00000000-0000-0000-0000-000000000000"
secret_file = "/run/credentials/harness-agent.service/workspace-webhook-secret"

# The agent's Workspace connection: its briefing and reply tools, and a look
# at the inbox at startup and every poll_seconds, in case a wakeup was missed.
# The token is the agent's own Workspace credential; workers never get it.
[agent.workspace]
url = "https://workspace.example/api/v1/mcp"
token_file = "/run/credentials/harness-agent.service/workspace-token"
poll_seconds = 300

# Shadow mode, for the agent's first real week: anything it would say outside
# the live conversations goes to a private channel instead, saying where it
# was meant to go, and nobody else sees it. Leave this table out to turn
# shadow mode off.
[agent.workspace.shadow]
# The private channel's conversation id.
channel = "00000000-0000-0000-0000-000000000001"
# Where it answers for real, such as your direct message with it.
live = ["00000000-0000-0000-0000-000000000002"]

# The sandboxed shell: run_command, one program with an argument array,
# inside bubblewrap. It can change only workdir (memory_dir stays read-only),
# protected paths are read-only, credentials are hidden, and there's no
# network. The system's /usr, /etc and /nix/store are shown read-only, so keep
# the runtime's own files out of them. Leave this table out for no shell.
[agent.shell]
bwrap = "/run/current-system/sw/bin/bwrap"
