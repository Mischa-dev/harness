# The daemon's config. It names key files and never holds keys; under
# systemd, point key_file at $CREDENTIALS_DIRECTORY (LoadCredential=).

[proxy]
# Loopback only: the proxy adds a key to anything it is sent.
listen = "127.0.0.1:8787"
# Callers send this file's contents in x-harness-proxy-token. Give it to the
# runtime only, never to workers. Make one with `openssl rand -hex 32`.
caller_token_file = "/run/credentials/harness-daemon.service/caller-token"

# Adapters call http://127.0.0.1:8787/anthropic/v1/messages and so on.
[[proxy.route]]
name = "anthropic"
upstream = "https://api.anthropic.com"
auth = "x-api-key"
key_file = "/run/credentials/harness-daemon.service/anthropic"

[[proxy.route]]
name = "openrouter"
upstream = "https://openrouter.ai/api"
auth = "bearer"
key_file = "/run/credentials/harness-daemon.service/openrouter"

# The wake loop: `harness-daemon run --config <path>`. Run it as its own
# service, separate from the proxy, with only the caller token as a
# credential; it never sees a provider key.
[agent]
state_dir = "/var/lib/harness"
workdir = "/home/agent"
profiles_file = "/etc/harness/profiles.toml"
# A profile name from profiles_file; the model itself is set there.
profile = "main"
# The proxy route for that profile's provider. Must be on loopback.
model_url = "http://127.0.0.1:8787/anthropic"
caller_token_file = "/run/credentials/harness-agent.service/caller-token"
charter_file = "/etc/harness/charter.md"
# The owner's local hour when the day ends, and their offset from UTC.
quiet_hour = 2
utc_offset_hours = 0

# Workspace's signed wakeups (inbox.available). Set the webhook URL on the
# agent's Workspace connection to http://<listen>/wake; Workspace shows the
# signing secret once. Leave this table out and the agent wakes only at the
# looks it chooses.
[agent.wakeups]
listen = "100.64.0.5:8790"
agent_id = "00000000-0000-0000-0000-000000000000"
secret_file = "/run/credentials/harness-agent.service/workspace-webhook-secret"
