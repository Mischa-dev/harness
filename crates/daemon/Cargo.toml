[package]
name = "harness-daemon"
description = "The daemon binary: the wake loop, and the forwarding proxy that adds provider keys to model calls."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "harness-daemon"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
harness-core.workspace = true
harness-loop.workspace = true
harness-providers = { workspace = true, features = ["http"] }
harness-store.workspace = true
harness-tools.workspace = true
harness-workspace.workspace = true
hmac = "0.12"
reqwest = { workspace = true, features = ["stream"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
thiserror.workspace = true
time = { workspace = true, features = ["formatting"] }
tokio = { workspace = true, features = ["net", "rt-multi-thread", "signal", "time"] }
toml.workspace = true
url = "2"

[dev-dependencies]
async-trait.workspace = true
axum = { version = "0.8", default-features = false, features = ["json"] }
futures-core = "0.3"
tokio = { workspace = true, features = ["test-util"] }
tempfile = "3"

[lints]
workspace = true
